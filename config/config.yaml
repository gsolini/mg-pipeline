# mg-pipeline default configuration
# -----------------------------------------------------------------------------
# This file defines EVERY key the workflow reads, with defaults that run the
# bundled test dataset as-is. Treat it as the schema: it should always be
# complete, even for steps that are turned off.
#
# For a real dataset, do NOT edit this file. Write a short run config in your
# analysis repo that overrides only what differs, and pass it in:
#
#   snakemake --configfile ../msh-analysis/msh_config.yaml --use-conda --cores 8
#
# Run configs merge recursively, so you must keep the nesting but only need to
# write the keys you are changing:
#
#   assembly:
#     assemblers: [megahit]      # coassembly/selection keep their defaults
# -----------------------------------------------------------------------------


# === Inputs and outputs ======================================================

# Sample sheet (TSV). See config/samples.tsv for the expected columns.
samples: config/samples.tsv

# Prefix prepended to the r1/r2/hic_r1/hic_r2 paths in the sample sheet.
# Leave as "" to require full paths in the sheet. Absolute paths in the sheet
# always win, even when this is set — so the two styles can be mixed.
fastq_dir: ""

# Root of the output tree. Use persistent group storage — results live here.
outdir: results

# Scratch space for large regenerable intermediates (BAMs, assembly temp).
# On Resnick this must be scratch, not /tmp.
scratch_dir: ""

# Directory for reference data: host indexes, Kraken2 DB, GTDB-Tk DB, etc.
resources_dir: resources


# === 01 — Read preprocessing (bbduk) =========================================
# Always runs. Adapter removal, quality trimming, length filtering, dedup.

preprocess:

  # FASTA of adapter sequences. "bbmap" resolves to the adapters.fa shipped
  # inside the bbmap conda package, which is the usual choice.
  adapters: bbmap

  # Force-trim modulo: right-trims reads to a length divisible by this.
  # 5 turns Illumina's junk 151st base into a clean 150. Set 0 to disable.
  ftm: 5

  # Minimum read length to keep AFTER trimming (bp).
  min_len: 50

  # Quality threshold for trimming (phred). Trims from both ends (qtrim=rl).
  trimq: 20

  # Kmer settings for adapter matching. k=23/mink=11 are the bbduk defaults
  # for adapter removal; hdist is the allowed mismatches.
  k: 23
  mink: 11
  hdist: 1

  # Remove PCR/optical duplicates with clumpify before trimming.
  dedupe: true

  # Sequencing platform used; this will determine the dedupe parameters
  # options are: "nextseq", "hiseq" (1T/2500), "hiseq_patterned" (3k/4k/X), "nextseq", "other"
  platform: other

  # Entropy filter: drops low-complexity reads. Set to 0 to disable.
  entropy: 0.0

  # Hi-C specific pre-processing defaults
  hic:
    # Hi-C duplicates are identified after alignment, from the mapped positions
    # of both ends (pairtools dedup) — read-level dedup can't do that correctly.
    # It also destroys the duplicate-rate QC metric, which for Hi-C reads as
    # prep quality rather than noise.
    dedupe: false


# === 02 — Host decontamination ===============================================
# Optional. Maps shotgun reads against a masked host index (Hostile) and
# discards what aligns. Hi-C reads are never decontaminated, see
# docs/modules/02_decontam.md.

decontam:
  enabled: false

  # Standard Hostile index, downloaded and cached automatically under
  # resources_dir on first use. Run `hostile index list` for the current set.
  # the list below was accurate as of 2026-10 and may be out of date.
  #
  #   human-t2t-hla
  #       T2T-CHM13v2.0 + IPD-IMGT/HLA. Unmasked.
  #   human-t2t-hla-argos985
  #       masked against 985 FDA-ARGOS bacterial genomes
  #   human-t2t-hla.rs-viral-202401_ml-phage-202401
  #       masked against RefSeq viral + Millard Lab phage
  #   human-t2t-hla.argos-bacteria-985_rs-viral-202401_ml-phage-202401
  #       masked against bacteria, viruses and phage (default here)
  #   human-t2t-hla-argos985-mycob140
  #       bacteria + 140 mycobacterial genomes
  #   mouse-mm39
  #   test-human-mit
  #       human mitochondrial genome; tiny, for testing only
  #
  # Masking matters: an unmasked human reference discards microbial reads that
  # match conserved human regions. The phage-masked index is the default
  # because geNomad calls phage downstream and losing them would be silent.
  index: human-t2t-hla.argos-bacteria-985_rs-viral-202401_ml-phage-202401

  # Set to a FASTA path to build a custom Bowtie2 index from it instead of
  # fetching a standard index. The result is UNMASKED — run `hostile mask`
  # yourself first if masking matters for your host.
  custom_fasta: ""

  # bowtie2 | minimap2 | auto. Hostile picks bowtie2 for short reads under
  # auto, which is always the case here.
  aligner: auto


# === 03 — Assembly ===========================================================

assembly:
  # Which assemblers to run. One or both of: megahit, spades
  # Running both produces two assemblies per sample and triggers selection.
  assemblers: [megahit]

  # Also produce a per-group co-assembly, in addition to per-sample assemblies.
  # Only applies to samples that have a `group` in the sample sheet.
  coassembly: false

  # Minimum contig length to keep (bp). Applied after assembly, before binning.
  min_contig_len: 1500

  # megahit preset: meta-sensitive | meta-large | (empty for default)
  megahit_preset: meta-sensitive

  # Extra flags passed straight through to the assembler, if ever needed.
  megahit_extra: ""
  spades_extra: ""


# === 04 — Assembly QC and representative selection ===========================

assembly_qc:
  # Run metaQUAST on each assembly.
  metaquast: true

  # How to pick a representative when multiple assemblers were run.
  # OPEN DESIGN QUESTION (see docs/design.md §9.1): the rule set is not settled.
  # "n50"   — highest N50 wins
  # "none"  — keep all assemblies and bin each separately
  selection: n50


# === 05 — MGE identification (geNomad) =======================================
# Optional. Flags plasmid/viral contigs. Extrachromosomal contigs are excluded
# from binning; proviruses stay in the MAGs (match the "|provirus" suffix).

mges:
  enabled: false
  db: genomad/genomad_db

# === 06a — Shotgun mapping ===================================================
# Produces the coverage used by coveage based binners. For grouped samples this is the
# differential-coverage step: every sample in a group maps to every assembly
# in that group.
mapping_shotgun:

  tool: bowtie2              # bowtie2 | minimap2
  min_mapq: 20
  # Keep sorted BAMs after depth tables are computed. Default false: the tables
  # are what binning needs, and BAMs are large and regenerable.
  keep_bams: false

# === 06b — Hi-C mapping ======================================================
# NOT the same as shotgun. Chimeric reads spanning a ligation junction are
# signal, so alignment is single-end and chimera-aware, then pairtools turns
# alignments into a pairs file. Hi-C dedup happens HERE, at the pair level.

# Three independent filters are applied in sequence:
#   min_aln_score:      bwa -T, report only well-matching alignments
#   bam_min_mapq:       samtools -q, drop ambiguously-placed reads
#   select_min_mapq:    pairtools, final per-pair mapq requirement

mapping_hic:

  bwa_flags: "-5SP"         # bwa mem flags: -5SP = chimera-aware single-end mode for Hi-C;
  min_aln_score: 30         # bwa mem -T: alignment score; not the same as mapq

  # Post-alignment BAM filter. -F 0x904 drops unmapped, secondary and
  # supplementary alignments.
  sam_flags_exclude: "0x904"
  min_mapq: 0

  # pairtools parse
  parse_min_mapq: 0          # keep everything; filter later in `select`
  add_columns: mapq          # preserves per-side MAPQ for downstream filtering

  # pairtools sort. MUST point at real disk — default /tmp on Resnick is
  # RAM-backed and fails on large libraries (seen at 404M and 449M reads).
  # sort_memory must stay below the rule's memory allocation or pairtools
  # will be OOM-killed.
  sort_memory: 64G
  # Sort spill space comes from Snakemake's {resources.tmpdir}, set in
  # profiles/slurm/config.yaml — not from this config.

  # Restriction digest. Dual-enzyme preps (Arima, Phase Genomics) need both;
  # the digest BED is built by cooler digest + merge of all cut positions.
  enzymes: [Sau3AI, MluCI]

  # Final valid-pair selection
  select_min_mapq: 30
  pair_types: [UU, UR, RU]      # only keep Hi-C reads where both ends have a UNIQUE alignment


# === 07 — Binning ============================================================

binning:
  # Coverage-based binners to run.
  binners: [metabat2, maxbin2, semibin2]

  # Hi-C binners. Only run for samples that have hic_r1/hic_r2 in the sheet.
  hic_binners: [metacc, bin3c]

  # Use cross-sample coverage within a group. When false, every sample is
  # binned on its own coverage only.
  differential_coverage: true

  # SemiBin2 built-in model: human_gut | ocean | soil | global | self
  # "self" trains on the sample itself (slower, better for environmental data).
  semibin_environment: self

  # Minimum bin size to report (bp).
  min_bin_size: 200000


# === 08, 09 — Refinement (Binette, dRep) =========================================================

refinement:
  # Binette reconciles the binners' output within a single assembly.
  binette: true

  # dRep dereplicates across assemblies within a group.
  drep: true

  # dRep secondary (genome-level) ANI threshold.
  drep_ani: 0.95

  # Quality thresholds for bins carried forward (CheckM2 completeness /
  # contamination, in percent).
  min_completeness: 50
  max_contamination: 10


# === 10 — Annotation =========================================================
# All optional; each runs on the refined, dereplicated genome set.

annotation:
  gtdbtk: false        # taxonomic classification
  bakta: false         # gene calling + annotation (calls genes itself)
  amrfinder: false     # AMR gene detection

  # Database locations, relative to resources_dir unless an absolute path is specified.
  gtdbtk_db: gtdbtk/release220
  bakta_db: bakta/db


# === 11 — Read-level taxonomic profiling =====================================

kraken2:
  enabled: false
  db: kraken2/standard
  confidence: 0.1


# === Resources ===============================================================
# Per-rule thread counts. Memory and walltime live in profiles/slurm/config.yaml
# so that local runs don't need cluster settings.

threads:
  preprocess: 8
  decontam: 8
  assembly: 16
  assembly_qc: 4
  mges: 8
  mapping_shotgun: 8
  mapping_hic: 16
  binning: 8
  refinement: 8
  annotation: 8
  profiling: 8
